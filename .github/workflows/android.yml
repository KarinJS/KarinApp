name: Build APK

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-latest

    steps:
      # ========================================
      # Checkout
      # ========================================

      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      # ========================================
      # Node / pnpm
      # ========================================

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.11.0
          cache: pnpm

      # ========================================
      # Java
      # ========================================

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ========================================
      # Android SDK
      # ========================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;27.1.12297006"

      # ========================================
      # Dependencies
      # ========================================

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      # ========================================
      # Project checks
      # ========================================

      - name: Check TypeScript
        run: |
          pnpm exec tsc --noEmit

      - name: Check ESLint
        run: |
          pnpm exec eslint . --no-cache

      # ========================================
      # Android signing
      # ========================================

      - name: Prepare Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > android/app/karin.jks

      # ========================================
      # Build APK
      # ========================================

      - name: Build signed release APK
        working-directory: android
        env:
          KARIN_STORE_FILE: karin.jks
          KARIN_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KARIN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KARIN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --stacktrace

      # ========================================
      # Verify APK
      # ========================================

      - name: Verify APK signature
        run: |
          apk="android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$apk" ]; then
            echo "APK not found: $apk"
            exit 1
          fi

          apksigner="$(
            find "$ANDROID_HOME/build-tools" \
              -type f \
              -name apksigner \
              | sort -V \
              | tail -n 1
          )"

          if [ -z "$apksigner" ]; then
            echo "apksigner not found"
            exit 1
          fi

          "$apksigner" verify --verbose --print-certs "$apk"

      # ========================================
      # Rename APK
      # ========================================

      - name: Rename APK
        run: |
          version="${GITHUB_REF_NAME#v}"

          mv \
            android/app/build/outputs/apk/release/app-release.apk \
            "Karin-${version}.apk"

      # ========================================
      # Upload artifact
      # ========================================

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Karin-${{ github.ref_name }}.apk
          path: Karin-${{ github.ref_name }}.apk
          if-no-files-found: error

      # ========================================
      # Remove signing key
      # ========================================

      - name: Remove signing key
        if: always()
        run: |
          rm -f android/app/karin.jks

      # ========================================
      # Create GitHub Release
      # ========================================

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"

          gh release create \
            "${GITHUB_REF_NAME}" \
            "Karin-${version}.apk" \
            --title "Karin v${version}" \
            --generate-notes