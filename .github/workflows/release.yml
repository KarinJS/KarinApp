name: Release APK

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  # ============================================================
  # 1. 运行 Release Please 创建 Release / Tag
  # ============================================================
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: node
          target-branch: main

  # ============================================================
  # 2. 构建 Android APK (仅当 Release 真正被创建时执行)
  # ============================================================
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    needs:
      - release-please

    if: ${{ needs.release-please.outputs.release_created == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.11.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.1.12297006"

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Show release version
        run: |
          echo "========================================"
          echo "Release version: ${{ needs.release-please.outputs.version }}"
          echo "Release tag:     ${{ needs.release-please.outputs.tag_name }}"
          echo "APK name:        Karin-${{ needs.release-please.outputs.version }}.apk"
          echo "========================================"

      - name: Decode Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -e
          mkdir -p android/app
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/karin.jks
          test -s android/app/karin.jks

      - name: Build Release APK
        working-directory: android
        env:
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
          KARIN_STORE_FILE: ${{ github.workspace }}/android/app/karin.jks
          KARIN_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KARIN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KARIN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Find APK
        id: apk
        run: |
          set -e
          APK=$(find android/app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::Release APK was not found."
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Verify APK signature
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: |
          set -e
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose "$APK_PATH"

      - name: Rename APK
        id: rename
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: |
          set -e
          OUTPUT="Karin-${VERSION}.apk"
          cp "$APK_PATH" "$OUTPUT"
          echo "output=$OUTPUT" >> "$GITHUB_OUTPUT"

      - name: Remove keystore
        if: always()
        run: |
          rm -f android/app/karin.jks

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Karin-${{ needs.release-please.outputs.version }}
          path: ${{ steps.rename.outputs.output }}
          if-no-files-found: error

  # ============================================================
  # 3. 将 APK 上传到刚刚创建的 GitHub Release 中
  # ============================================================
  upload-release:
    name: Upload APK to Release
    runs-on: ubuntu-latest
    needs:
      - release-please
      - build

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: Karin-${{ needs.release-please.outputs.version }}
          path: release

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -e
          APK="release/Karin-${VERSION}.apk"
          test -f "$APK"
          gh release upload "$TAG" "$APK" --clobber
          echo "Successfully uploaded $APK to release $TAG"